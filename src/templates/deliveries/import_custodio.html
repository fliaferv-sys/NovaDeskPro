{% extends "layouts/base.html" %}

{% block content %}
<div class="container">

    <h2>📦 Importar equipos a Custodio</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="file" name="file" required>

        <br><br>

        <button type="submit" class="btn btn-primary">
            Importar
        </button>

    </form>

</div>
{% endblock %}
