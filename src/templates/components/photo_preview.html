{% load static %}
<link rel="stylesheet" href="{% static 'shared/css/photo_preview.css' %}">
<div
    class="photo-preview-modal"
    id="photoPreviewModal"
    hidden
    aria-hidden="true">

    <div
        class="photo-preview-dialog"
        role="dialog"
        aria-modal="true"
        aria-label="Vista ampliada de foto">

        <button
            type="button"
            class="photo-preview-close"
            data-photo-preview-close
            aria-label="Cerrar">
            &times;
        </button>

        <img
            id="photoPreviewImage"
            class="photo-preview-image"
            alt="Foto ampliada">

    </div>
</div>
<script src="{% static 'shared/js/photo_preview.js' %}" defer></script>
